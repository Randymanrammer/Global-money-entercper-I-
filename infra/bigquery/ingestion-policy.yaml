version: 1
ingestion_policy:
  streams:
    - name: api_events_stream
      source: pubsub
      sink: bigquery.core_transactions.transaction_events
      retry:
        mode: exponential_backoff
        max_attempts: 6
        initial_seconds: 5
        max_seconds: 300
      dead_letter:
        enabled: true
        topic: api-events-dlq
    - name: reconciliation_batch
      source: cloud_storage
      sink: bigquery.core_transactions.customer_balances
      retry:
        mode: bounded_retries
        max_attempts: 3
      dead_letter:
        enabled: true
        location: gs://gme-reconciliation-dlq
  data_quality:
    freshness_sla_minutes: 30
    required_checks:
      - completeness
      - uniqueness
      - schema_compatibility
      - null_rate_threshold
    completeness:
      required_fields:
        event_id: 1.0
        tenant_id: 1.0
        event_type: 1.0
        event_timestamp: 1.0
        ingestion_timestamp: 1.0
        schema_version: 1.0
    uniqueness:
      key_fields:
        - event_id
      min_unique_ratio: 1.0
    null_rate_threshold:
      fields:
        account_id: 0.1
        amount: 0.05
        currency: 0.02
        region: 0.02
        source_system: 0.02
        trace_id: 0.15
