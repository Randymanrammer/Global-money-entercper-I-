name: Auto Approve & Merge Draft PRs

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Ready and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ -n "$APPROVAL_TOKEN" ]]; then
            GH_TOKEN="$APPROVAL_TOKEN" gh pr review "$PR_URL" --approve --body "Automated approval."
          fi

          REVIEW_DECISION="$(gh pr view "$PR_URL" --json reviewDecision --jq '.reviewDecision // \"\"')"
          MERGEABLE_STATE="$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable // \"\"')"
          MERGE_STATE_STATUS="$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus // \"\"')"
          if [[ -z "$APPROVAL_TOKEN" && "$REVIEW_DECISION" == "REVIEW_REQUIRED" ]]; then
            echo "Skipping merge because approval is still required and PR_AUTOMATION_TOKEN is not configured."
            exit 0
          fi

          if [[ "$MERGEABLE_STATE" != "MERGEABLE" || "$MERGE_STATE_STATUS" =~ ^(BEHIND|BLOCKED|DIRTY|DRAFT|UNKNOWN)$ ]]; then
            echo "Skipping merge because the PR is not currently mergeable (mergeable=$MERGEABLE_STATE, mergeStateStatus=$MERGE_STATE_STATUS)."
            exit 0
          fi

          gh pr merge "$PR_URL" --merge --delete-branch
