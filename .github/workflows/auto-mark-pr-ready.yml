name: Auto Ready and Merge PRs

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Ready, Approve, and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            gh pr ready "$PR_URL" || true
          fi

          if [[ -n "$APPROVAL_TOKEN" ]]; then
            GH_TOKEN="$APPROVAL_TOKEN" gh pr review "$PR_URL" --approve --body "Automated PR Approval"
          fi

          for attempt in 1 2 3 4 5; do
            read -r REVIEW_DECISION MERGEABLE_STATE MERGE_STATE_STATUS < <(
              gh pr view "$PR_URL" --json reviewDecision,mergeable,mergeStateStatus --jq '[.reviewDecision // "", .mergeable // "", .mergeStateStatus // ""] | @tsv'
            )
            if [[ ! "$REVIEW_DECISION" =~ ^(REVIEW_REQUIRED|CHANGES_REQUESTED)$ && "$MERGEABLE_STATE" == "MERGEABLE" && ! "$MERGE_STATE_STATUS" =~ ^(BEHIND|BLOCKED|DIRTY|DRAFT|UNKNOWN)$ ]]; then
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 2
            fi
          done

          if [[ "$REVIEW_DECISION" == "CHANGES_REQUESTED" ]]; then
            echo "Skipping merge because changes are still requested on the PR."
            exit 0
          fi

          if [[ -z "$APPROVAL_TOKEN" && "$REVIEW_DECISION" == "REVIEW_REQUIRED" ]]; then
            echo "Skipping merge because approval is still required and PR_AUTOMATION_TOKEN is not configured."
            exit 0
          fi

          if [[ "$MERGEABLE_STATE" != "MERGEABLE" || "$MERGE_STATE_STATUS" =~ ^(BEHIND|BLOCKED|DIRTY|DRAFT|UNKNOWN)$ ]]; then
            echo "Skipping merge because the PR is not currently mergeable (mergeable=$MERGEABLE_STATE, mergeStateStatus=$MERGE_STATE_STATUS)."
            exit 0
          fi

          gh pr merge "$PR_URL" --merge --delete-branch || gh pr merge "$PR_URL" --auto --merge --delete-branch
