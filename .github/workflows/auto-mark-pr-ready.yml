name: Auto Approve & Merge Draft PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.action == 'ready_for_review' || github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Ready and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVAL_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            gh pr ready "$PR_URL"
          fi

          if [[ -n "$APPROVAL_TOKEN" ]]; then
            GH_TOKEN="$APPROVAL_TOKEN" gh pr review "$PR_URL" --approve --body "Automated approval."
          else
            echo "Skipping approval because PR_AUTOMATION_TOKEN is not configured."
          fi

          gh pr merge "$PR_URL" --merge --delete-branch
