name: Azure WebApp CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'
  INGRESS_HEALTHCHECK_URL: ${{ vars.INGRESS_HEALTHCHECK_URL }}

permissions:
  contents: read

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_package_json: ${{ steps.detect-build-inputs.outputs.has_package_json }}
    steps:
    - uses: actions/checkout@v4

    - name: Detect build inputs
      id: detect-build-inputs
      run: |
        if [ -f package.json ]; then
          echo "has_package_json=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_package_json=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.detect-build-inputs.outputs.has_package_json == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      if: steps.detect-build-inputs.outputs.has_package_json == 'true'
      run: |
        npm ci
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Validate publish configuration
      id: publish-config
      run: |
        if [ -n "${{ env.AZURE_WEBAPP_NAME }}" ] && [ "${{ env.AZURE_WEBAPP_NAME }}" != "your-app-name" ] && [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
          echo "can_deploy=true" >> "$GITHUB_OUTPUT"
        else
          echo "can_deploy=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download artifact from build job
      if: steps.publish-config.outputs.can_deploy == 'true'
      uses: actions/download-artifact@v4.1.3
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      if: steps.publish-config.outputs.can_deploy == 'true'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Verify public ingress endpoint
      if: steps.publish-config.outputs.can_deploy == 'true' && env.INGRESS_HEALTHCHECK_URL != ''
      run: |
        curl --fail --show-error --silent --max-time 20 "${{ env.INGRESS_HEALTHCHECK_URL }}"

    - name: Publish configuration reminder
      if: steps.publish-config.outputs.can_deploy != 'true'
      run: |
        echo "::warning::Deployment skipped. Set repository variable AZURE_WEBAPP_NAME and secret AZURE_WEBAPP_PUBLISH_PROFILE to publish publicly."
