name: Build and deploy Node app to Azure Web App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_PACKAGE_PATH: "."
  NODE_VERSION: "20.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install, build, and test
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: No Node project found
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json found; skipping Node build/test steps."

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4.6.2
        with:
          name: node-app
          path: .

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      contents: none

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4.1.3
        with:
          name: node-app

      - name: Check deploy configuration
        id: deploy-config
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$AZURE_WEBAPP_NAME" ] && [ -n "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing Azure deploy config. Set AZURE_WEBAPP_NAME (repository variable) and AZURE_WEBAPP_PUBLISH_PROFILE (repository secret)."
          fi

      - name: Deploy to Azure WebApp
        id: deploy-to-webapp
        if: ${{ steps.deploy-config.outputs.ready == 'true' }}
        uses: azure/webapps-deploy@v2.2.19
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ vars.AZURE_WEBAPP_PACKAGE_PATH || env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Output published URL
        if: ${{ steps.deploy-config.outputs.ready == 'true' && steps.deploy-to-webapp.outputs.webapp-url != '' }}
        run: |
          echo "Published URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}"
