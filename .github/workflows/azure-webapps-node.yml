name: Build and deploy Node app to Azure Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      restart_deploy:
        description: "Force a fresh deploy run for restart scenarios"
        required: false
        type: boolean
        default: false

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: your-app-name
  AZURE_WEBAPP_PACKAGE_PATH: "."
  NODE_VERSION: "20.x"
  PUBLIC_HEALTHCHECK_PATH: "/"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect package.json
        id: detect_package
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect_package.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install, build, and test
        if: steps.detect_package.outputs.has_package_json == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          retention-days: 7

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment:
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Validate deployment configuration
        id: deploy_config
        shell: bash
        run: |
          if [ "${{ env.AZURE_WEBAPP_NAME }}" = "your-app-name" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_WEBAPP_NAME is still set to default placeholder."
            exit 0
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_WEBAPP_PUBLISH_PROFILE is not configured."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download artifact from build job
        if: steps.deploy_config.outputs.ready == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: node-app

      - name: Deploy to Azure WebApp
        if: steps.deploy_config.outputs.ready == 'true'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Verify public ingress health endpoint
        if: steps.deploy_config.outputs.ready == 'true'
        shell: bash
        run: |
          WEBAPP_URL="${{ steps.deploy-to-webapp.outputs.webapp-url }}"
          if [ -z "$WEBAPP_URL" ]; then
            echo "::error::Deploy step did not return a webapp URL."
            exit 1
          fi
          HEALTH_URL="${WEBAPP_URL}${{ env.PUBLIC_HEALTHCHECK_PATH }}"
          echo "Checking $HEALTH_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$HEALTH_URL" > /dev/null
