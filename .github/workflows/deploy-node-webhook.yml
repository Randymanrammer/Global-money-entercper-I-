name: CI and Deploy (Platform Agnostic)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      restart_deploy:
        description: "Force a fresh deploy trigger for restart scenarios"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20.x"
  PUBLIC_HEALTHCHECK_URL: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect package.json
        id: detect_package
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect_package.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install, build, and test
        if: steps.detect_package.outputs.has_package_json == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build --if-present
          npm run test --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-source
          path: .
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: none
    steps:
      - name: Validate deploy webhook secret
        id: deploy_config
        shell: bash
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_WEBHOOK_URL is not configured. Skipping deploy trigger."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        if: steps.deploy_config.outputs.ready == 'true'
        uses: actions/download-artifact@v4.1.3
        with:
          name: app-source

      - name: Trigger deployment webhook
        if: steps.deploy_config.outputs.ready == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Verify public ingress health endpoint
        if: steps.deploy_config.outputs.ready == 'true' && env.PUBLIC_HEALTHCHECK_URL != ''
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 10 --retry-connrefused \
            "${{ env.PUBLIC_HEALTHCHECK_URL }}" > /dev/null
