<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Money Entercper — Diagnostic Dashboard</title>
  <style>
    :root {
      --bg: #0b0c15;
      --panel: #151725;
      --accent: #00e5ff;
      --text: #e6e8f0;
      --muted: #8b92a8;
      --ok: #00d68f;
      --warn: #ffb86c;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 1.5rem 2rem; border-bottom: 1px solid #2a2d3e; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
    .refresh { background: var(--accent); color: #000; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    main { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .card { background: var(--panel); padding: 1.25rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; background: var(--bad); }
    .status.ok { background: var(--ok); }
    .status.warn { background: var(--warn); }
    pre { background: #0e101a; padding: 0.75rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; max-height: 220px; }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; color: var(--muted); white-space: pre-wrap; }
    .grid-2 { grid-column: 1 / -1; }
    footer { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Global Money Entercper — Diagnostic Dashboard</h1>
    <button class="refresh" id="refresh">Refresh</button>
  </header>
  <main>
    <div class="card">
      <h2>Ingress Gateway</h2>
      <div><span id="ingress-dot" class="status"></span><span id="ingress-text">Checking...</span></div>
    </div>
    <div class="card">
      <h2>Holodeck</h2>
      <div><span id="holodeck-dot" class="status"></span><span id="holodeck-text">Checking...</span></div>
    </div>
    <div class="card">
      <h2>Interceptor</h2>
      <div><span id="interceptor-dot" class="status"></span><span id="interceptor-text">Checking...</span></div>
    </div>
    <div class="card">
      <h2>Vault</h2>
      <div><span id="vault-dot" class="status"></span><span id="vault-text">Checking...</span></div>
    </div>
    <div class="card">
      <h2>Ops</h2>
      <div><span id="ops-dot" class="status"></span><span id="ops-text">Checking...</span></div>
    </div>
    <div class="card grid-2">
      <h2>Communication Scan</h2>
      <pre id="scan">Press Refresh to load.</pre>
    </div>
    <div class="card grid-2">
      <h2>Event Log</h2>
      <div id="log" class="log"></div>
    </div>
  </main>
  <footer>Built for the Global Money Entercper platform.</footer>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent = line + '\n' + logEl.textContent;
    }

    async function checkService(name) {
      try {
        const url = name === 'ingress' ? '/health' : `/api/v1/communicate`;
        const res = await fetch(name === 'ingress' ? '/health' : `/api/v1/communicate`);
        if (name === 'ingress') return res.ok ? { status: 'ok' } : null;
        return res.ok ? await res.json() : null;
      } catch (e) {
        return null;
      }
    }

    async function refresh() {
      log('Running diagnostic scan...');
      try {
        const res = await fetch('/api/v1/communicate');
        const data = res.ok ? await res.json() : null;
        document.getElementById('scan').textContent = JSON.stringify(data, null, 2);

        const services = data ? data.results.map(r => r.service) : [];
        services.forEach(svc => {
          const result = data.results.find(r => r.service === svc);
          const ok = result && result.status === 'reachable';
          document.getElementById(`${svc}-dot`).className = 'status ' + (ok ? 'ok' : 'warn');
          document.getElementById(`${svc}-text`).textContent = ok ? 'Healthy' : (result ? result.status : 'unknown');
        });

        const ingressOk = await fetch('/health').then(r => r.ok).catch(() => false);
        document.getElementById('ingress-dot').className = 'status ' + (ingressOk ? 'ok' : 'warn');
        document.getElementById('ingress-text').textContent = ingressOk ? 'Healthy' : 'Unreachable';
        log('Scan complete.');
      } catch (e) {
        document.getElementById('scan').textContent = 'Error: ' + e.message;
        log('Scan failed: ' + e.message);
      }
    }

    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
